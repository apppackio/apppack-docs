---
name: Aggregate Changelogs

on:
  schedule:
    # Run 3 times per day: 00:00, 08:00, 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: {}

# Neither read nor write goes through GITHUB_TOKEN (see the steps below), so
# it needs nothing beyond reading the repository.
permissions:
  contents: read

# A manual dispatch overlapping the schedule would race on the push, and the
# loser fails as a non-fast-forward. Queue instead -- never cancel, since a run
# can be interrupted between the push to main and the push to deploy/prod.
concurrency:
  group: aggregate-changelogs
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04

    steps:
      # Two tokens, deliberately split by privilege. This App is installed on
      # apppack-docs alone, so the write credential cannot reach the private
      # source repos; APPPACK_DOCS_TOKEN reads those and cannot write anywhere.
      - name: Mint write token
        id: write_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}

      # The pushes at the end reuse the credential checkout persists, so
      # checkout takes the write token. An App token (unlike GITHUB_TOKEN)
      # triggers workflows, which is what makes the deploy/prod push deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write_token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Read-only PAT. The App token above has no access to apppack-backend
      # or apppack-web, so it is useless here.
      - name: Aggregate changelogs
        env:
          GITHUB_TOKEN: ${{ secrets.APPPACK_DOCS_TOKEN }}
        run: uv run --frozen python scripts/aggregate_changelogs.py --verbose

      # No `make check-nav` here. src/command-line-reference is gitignored, so
      # a fresh checkout has none of it and the nav's 84 entries all look dead.
      # It would need the CLI installed just to generate pages this job never
      # builds. The push below triggers ci_cd.yml, which does it properly.

      # `git add` before diffing: the generated pages are untracked on the
      # first run, and `git diff` alone never sees untracked files.
      - name: Commit to main and promote to deploy/prod
        run: |
          set -eux
          # Attribute commits to the App's own bot user rather than to
          # github-actions[bot], which is not who is pushing. The numeric id
          # is what links the noreply address to the bot's profile.
          bot="${{ steps.write_token.outputs.app-slug }}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git add -A src/changelog/
          if git diff --cached --quiet; then
            echo "No changelog changes to publish."
            exit 0
          fi
          git commit -m "Update aggregated changelogs"
          git push origin HEAD:main
          # Fast-forward only. If deploy/prod has diverged from main this
          # fails loudly rather than clobbering whatever is deployed.
          git push origin HEAD:deploy/prod
        env:
          GH_TOKEN: ${{ github.token }}
