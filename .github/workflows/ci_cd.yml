---
name: build

on:
  push: {}
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run --frozen pytest

      - name: AppPack CLI
        uses: apppackio/setup-apppack-cli@054eba8987250ae5dcb4673be4dbdc7dfa9a7cea # v2.0.0

      - name: CLI docs
        run: make cli-docs
      - name: Check nav is complete
        run: make check-nav
      - name: Build
        run: APPPACK_VERSION=$(apppack version) make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: public
          retention-days: 3
  deploy:
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/deploy/prod'
    environment: production
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ROLE_ARN: "arn:aws:iam::101287669015:role/docs-github-actions"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: artifact
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Deploy
        run: mv artifact public && make deploy
