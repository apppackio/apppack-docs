site_name: AppPack Docs
docs_dir: src
site_dir: public
site_url: !ENV [SITE_URL, "http://localhost:8000/"]
use_directory_urls: true
markdown_extensions:
  - attr_list
  - footnotes
  - abbr
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - tables
# Zensical silently ignores plugins it does not implement -- it collects the
# names without validating them, so an unsupported plugin is a no-op rather
# than an error. That is how mkdocs-literate-nav failed quietly during the
# migration (the nav fell back to auto-generation). When upgrading Zensical,
# expect "the plugin does nothing" as the failure mode, not a build error.
plugins:
  - search
  - macros
  # Tags label each changelog page with the repository it came from. Requires
  # zensical >= 0.0.60; earlier versions accept the plugin name and do nothing.
  # Note `tags_file` is recognized but silently dropped -- the tag listing is
  # produced by the listings directive on changelog/tags.md instead.
  - tags
repo_url: https://github.com/apppackio/apppack-docs/
edit_uri: edit/main/src/
extra_css:
  - stylesheets/extra.css
theme:
  name: zensical
  custom_dir: theme_overrides
  palette:
    primary: slate blue
  logo: assets/mark-white.svg
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
    tag:
      default: lucide/hash
      cli: lucide/terminal
      stacks: lucide/layers
      ci-builder: lucide/hammer
extra:
  # Maps the tag names emitted by scripts/aggregate_changelogs.py to the icon
  # identifiers above. The alias in [[tool.changelog.repositories]] is the tag.
  tags:
    cli: cli
    stacks: stacks
    ci-builder: ci-builder
nav:
  - index.md
  - Tutorials:
      - tutorials/initial-setup.md
      - tutorials/deploy-first-app.md
  - How-to guides:
      - Add ons:
          - how-to/add-ons/sending-email.md
          - how-to/add-ons/using-databases.md
          - how-to/add-ons/using-redis.md
          - how-to/add-ons/using-s3.md
          - how-to/add-ons/using-sqs.md
          - how-to/add-ons/working-with-files.md
      - Apps:
